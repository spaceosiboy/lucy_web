<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lucy</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="app">

        <div class="title">
            L U C Y
        </div>

        <div class="ring-container">

            <div
                id="status-ring"
                class="status-ring"
            >
                <div class="ring-inner"></div>
                <div class="ring-scope"></div>
                <div class="ring-point"></div>
            </div>

        </div>

        <div
            id="status"
            class="status"
        >
            LISTENING
        </div>

        <div
            id="conversation"
            class="conversation"
        ></div>

        <div
            id="processing"
            class="processing hidden"
        >
            ...
        </div>

        <form id="chat-form">

            <input
                id="text-input"
                type="text"
                placeholder="> _"
                autocomplete="off"
            >

            <button
                id="send-button"
                type="submit"
            >
                SEND
            </button>

        </form>

    </div>

    <script src="script.js"></script>

</body>
</html>
